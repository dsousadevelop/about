<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Alpha | GitHub Presentation</title>
    
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS v4 Browser Script -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --color-bg: oklch(12% 0.01 250);
            --color-card: oklch(18% 0.02 260 / 0.6);
            --color-primary: oklch(65% 0.25 260);
            --color-secondary: oklch(70% 0.2 310);
            --color-accent: oklch(85% 0.15 160);
            
            --font-sans: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            
            --radius-custom: 1.5rem;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .animate-floating {
            animation: floating 3s ease-in-out infinite;
        }

        .glass-card {
            @apply bg-card border border-white/5 backdrop-blur-xl transition-all duration-500;
        }

        .glass-card:hover {
            @apply border-primary/30 ring-1 ring-primary/20 scale-[1.01] shadow-[0_0_40px_-10px_rgba(var(--color-primary),0.2)];
        }

        body {
            background-color: var(--color-bg);
            color: white;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: 
                radial-gradient(circle at 20% 20%, oklch(65% 0.2 260 / 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, oklch(70% 0.2 310 / 0.05) 0%, transparent 40%);
            z-index: -1;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center font-sans">
    
    <div class="bg-glow"></div>

    <main class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-4 lg:grid-cols-6 gap-4">
        
        <!-- Bio Section -->
        <section class="lg:col-span-4 md:col-span-full glass-card rounded-custom p-8 flex flex-col md:flex-row items-center gap-8 group">
            <div class="relative">
                <div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-gradient-to-tr from-primary to-secondary p-1 animate-floating shadow-2xl">
                    <img src="./avatar.png" alt="Profile" class="w-full h-full rounded-full bg-bg object-cover">
                </div>
                <div class="absolute -bottom-2 -right-2 bg-accent px-3 py-1 rounded-full text-[10px] font-bold text-bg tracking-wider animate-pulse border-2 border-bg">
                    ONLINE
                </div>
            </div>
            <div class="text-center md:text-left flex-1">
                <h1 class="font-display text-4xl md:text-5xl font-extrabold mb-2 bg-gradient-to-r from-primary via-secondary to-white bg-clip-text text-transparent">
                    Frontend Master
                </h1>
                <p class="text-xl md:text-2xl font-medium text-white/80 mb-4 font-display">
                    Construindo o futuro com pixels e código.
                </p>
                <div class="flex flex-wrap justify-center md:justify-start gap-4 text-sm text-white/60">
                    <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-4 h-4"></i> Brasil, Planeta Terra</span>
                    <span class="flex items-center gap-1"><i data-lucide="code-2" class="w-4 h-4"></i> Open Source Lover</span>
                </div>
            </div>
        </section>

        <!-- Social Grid -->
        <section class="lg:col-span-2 md:col-span-2 glass-card rounded-custom p-6 grid grid-cols-2 gap-4">
            <a href="#" class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl bg-white/5 hover:bg-primary/20 transition-all border border-white/5 hover:border-primary/40 group">
                <i data-lucide="github" class="w-8 h-8 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest text-white/40 group-hover:text-white">Github</span>
            </a>
            <a href="#" class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl bg-white/5 hover:bg-blue-500/20 transition-all border border-white/5 hover:border-blue-500/40 group">
                <i data-lucide="linkedin" class="w-8 h-8 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest text-white/40 group-hover:text-white">LinkedIn</span>
            </a>
            <a href="#" class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl bg-white/5 hover:bg-purple-500/20 transition-all border border-white/5 hover:border-purple-500/40 group">
                <i data-lucide="terminal" class="w-8 h-8 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest text-white/40 group-hover:text-white">Stack</span>
            </a>
            <a href="#" class="flex flex-col items-center justify-center gap-2 p-4 rounded-2xl bg-white/5 hover:bg-accent/20 transition-all border border-white/5 hover:border-accent/40 group">
                <i data-lucide="mail" class="w-8 h-8 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest text-white/40 group-hover:text-white">Email</span>
            </a>
        </section>

        <!-- Skills Section -->
        <section class="lg:col-span-3 md:col-span-2 glass-card rounded-custom p-8">
            <h3 class="font-display text-xl font-bold mb-6 flex items-center gap-2">
                <span class="w-2 h-2 bg-primary rounded-full"></span> Hard Skills
            </h3>
            <div class="flex flex-wrap gap-2">
                <span class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-sm font-medium hover:bg-primary/20 hover:border-primary/40 transition-all cursor-default">React v19</span>
                <span class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-sm font-medium hover:bg-primary/20 hover:border-primary/40 transition-all cursor-default">Next.js 15</span>
                <span class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-sm font-medium hover:bg-secondary/20 hover:border-secondary/40 transition-all cursor-default">Tailwind v4</span>
                <span class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-sm font-medium hover:bg-primary/20 hover:border-primary/40 transition-all cursor-default">Modern CSS</span>
                <span class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-sm font-medium hover:bg-accent/20 hover:border-accent/40 transition-all cursor-default">Performance</span>
                <span class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-sm font-medium hover:bg-white/10 transition-all cursor-default">Figma API</span>
            </div>
        </section>

        <!-- Stats Section -->
        <section class="lg:col-span-3 md:col-span-2 glass-card rounded-custom p-8 relative overflow-hidden group">
            <h3 class="font-display text-xl font-bold mb-6">GitHub Stats</h3>
            <div class="grid grid-cols-2 gap-4 relative z-10">
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-primary/5 transition-colors">
                    <span class="text-2xl font-display font-black text-primary">1.2k</span>
                    <p class="text-[10px] text-white/40 uppercase tracking-widest mt-1">Stars Reached</p>
                </div>
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 hover:bg-secondary/5 transition-colors">
                    <span class="text-2xl font-display font-black text-secondary">420</span>
                    <p class="text-[10px] text-white/40 uppercase tracking-widest mt-1">Pull Requests</p>
                </div>
            </div>
            
            <!-- Abstract background icon -->
            <i data-lucide="git-merge" class="absolute -right-6 -bottom-6 w-32 h-32 text-white/5 -rotate-12 group-hover:rotate-0 transition-transform duration-700"></i>
        </section>

    </main>

    <script>
      lucide.createIcons();
    </script>
</body>
</html>
